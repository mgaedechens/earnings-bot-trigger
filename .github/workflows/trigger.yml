name: Trigger Earnings Bot

on:
  # schedule desactivado — cron-job.org es el scheduler principal (8:00 AM Chile, sin delays)
  # Para reactivar: descomentar las dos líneas de abajo
  # schedule:
  #   - cron: "0 2 * * 1-5"
  workflow_dispatch:           # solo manual por si se necesita

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch earnings-bot workflow on private repo
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mgaedechens/Earningstranscriptbot/actions/workflows/earnings-bot.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP status: $HTTP"
          cat /tmp/body.txt
          [ "$HTTP" = "204" ] || exit 1
