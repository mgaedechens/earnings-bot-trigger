name: Trigger Earnings Bot

on:
  schedule:
    - cron: "0 2 * * 1-5"     # 02:00 UTC: 22:00 noche anterior Chile invierno / 23:00 noche anterior Chile verano. Con 6hrs de delay extremo de GitHub, igual llega antes de 8 AM Chile
  workflow_dispatch:           # allow manual trigger too

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch earnings-bot workflow on private repo
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mgaedechens/Earningstranscriptbot/actions/workflows/earnings-bot.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP status: $HTTP"
          cat /tmp/body.txt
          [ "$HTTP" = "204" ] || exit 1
